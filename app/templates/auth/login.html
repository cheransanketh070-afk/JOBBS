{% extends "base.html" %}
{% block title %}Log in — {{ site_name }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to run a search.</p>

    <a href="{{ url_for('auth.google_login') }}" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8c-.2 1.1-.9 2.1-1.8 2.7v2.3h3C16.9 14.1 17.6 11.9 17.6 9.2z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-3-2.3c-.8.6-1.9.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3C2.5 16 5.5 18 9 18z"/><path fill="#FBBC05" d="M4 10.7c-.2-.6-.3-1.1-.3-1.7s.1-1.1.3-1.7V4.9H1C.4 6.2 0 7.6 0 9s.4 2.8 1 4.1l3-2.4z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.4 3.4 1.3l2.6-2.6C13.5.9 11.4 0 9 0 5.5 0 2.5 2 1 4.9l3 2.4C4.7 5.2 6.7 3.6 9 3.6z"/></svg>
      Continue with Google
    </a>

    <div class="divider"><span>or</span></div>

    <form method="POST" novalidate>
      {{ form.hidden_tag() }}
      <label>{{ form.email.label }}
        {{ form.email(placeholder="you@example.com") }}
        {% for e in form.email.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
      </label>
      <label>{{ form.password.label }}
        {{ form.password(placeholder="Your password") }}
        {% for e in form.password.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
      </label>
      <label class="checkbox-row">{{ form.remember() }} {{ form.remember.label }}</label>
      {{ form.submit(class="btn btn-primary btn-full") }}
    </form>

    <p class="auth-footnote">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
