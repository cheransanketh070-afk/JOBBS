{% extends "base.html" %}
{% block title %}Search jobs — {{ site_name }}{% endblock %}
{% block content %}
<section class="dash">
  <div class="wrap">
    <h1 class="dash-title">Find jobs</h1>

    <form id="search-form" class="filter-bar" autocomplete="off">
      <div class="filter-field filter-wide">
        <label for="keyword">Job category / keyword</label>
        <input type="text" id="keyword" name="keyword" list="category-list" placeholder="e.g. Software Engineer" required maxlength="100">
        <datalist id="category-list">
          {% for c in categories %}<option value="{{ c }}">{% endfor %}
        </datalist>
      </div>

      <div class="filter-field">
        <label for="country">Country</label>
        <select id="country" name="country">
          {% for c in countries %}<option value="{{ c }}" {% if c == 'Worldwide' %}selected{% endif %}>{{ c }}</option>{% endfor %}
        </select>
      </div>

      <div class="filter-field">
        <label for="date_posted">Posted within</label>
        <select id="date_posted" name="date_posted">
          {% for key, val in date_posted.items() %}<option value="{{ key }}">{{ val.label }}</option>{% endfor %}
        </select>
      </div>

      <div class="filter-field">
        <label for="workplace_type">Workplace</label>
        <select id="workplace_type" name="workplace_type">
          {% for key, val in workplace_types.items() %}<option value="{{ key }}">{{ val.label }}</option>{% endfor %}
        </select>
      </div>

      <div class="filter-field filter-narrow">
        <label for="max_results">Results (max 50)</label>
        <input type="number" id="max_results" name="max_results" min="5" max="50" value="25">
      </div>

      <button type="submit" class="btn btn-primary find-btn" id="find-btn">
        <span class="find-btn-label">Find jobs</span>
        <span class="find-btn-spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div id="status-panel" class="status-panel" hidden>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <p id="status-text">Searching live postings…</p>
    </div>

    <div id="results-meta" class="results-meta" hidden></div>
    <div id="results-grid" class="results-grid"></div>
  </div>
</section>

<template id="job-card-template">
  <article class="job-card">
    <div class="job-card-head">
      <h3 class="job-title"></h3>
      <span class="job-date"></span>
    </div>
    <p class="job-company"></p>
    <p class="job-location"></p>
    <p class="job-snippet"></p>
    <a class="job-link" target="_blank" rel="noopener noreferrer">View posting →</a>
  </article>
</template>
{% endblock %}

{% block head_extra %}
<script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
