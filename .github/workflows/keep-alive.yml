name: Keep Render App Awake

on:
  schedule:
    # Run every 10 minutes, offset from the top of the hour
    - cron: "3,13,23,33,43,53 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render service
        run: |
          echo "Pinging Render service..."

          curl --fail --silent --show-error \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            https://jobbs-4jsh.onrender.com/

          echo "Render service responded successfully."
